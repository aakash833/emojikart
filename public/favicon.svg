<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Transparent background -->
  <rect width="64" height="64" fill="none"/>
  
  <!-- Vibrant colorful design -->
  <defs>
    <!-- Bright fire gradient -->
    <radialGradient id="fireGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#FF6347;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.8" />
    </radialGradient>
    
    <!-- Border gradient - very vibrant -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF0000;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FF4500;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF6347;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF4500" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Vibrant outer border -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#borderGradient)" stroke-width="3.5" filter="url(#shadow)"/>
  
  <!-- Inner glow ring -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#FF8C00" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Background glow circle for fire -->
  <circle cx="32" cy="36" r="22" fill="url(#fireGradient)" opacity="0.3"/>
  
  <!-- Fire emoji 🔥 - MUCH BIGGER (52px instead of 38px) -->
  <text x="32" y="46" font-size="52" text-anchor="middle" dominant-baseline="middle" font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, Segoe UI Symbol, sans-serif" filter="url(#glow)">🔥</text>
  
  <!-- Colorful sparkles around the fire -->
  <circle cx="18" cy="18" r="2.5" fill="#FFD700" opacity="0.9"/>
  <circle cx="46" cy="18" r="2" fill="#FF6347" opacity="0.9"/>
  <circle cx="18" cy="46" r="2" fill="#FF8C00" opacity="0.9"/>
  <circle cx="46" cy="46" r="2.5" fill="#FFD700" opacity="0.9"/>
  <circle cx="32" cy="12" r="1.5" fill="#FF4500" opacity="0.8"/>
  <circle cx="32" cy="52" r="1.5" fill="#FF6347" opacity="0.8"/>
</svg>
